name: OOOI Flight Logger
version: "2.0.2"
slug: oooi_logger
description: Scan the ACARS OOOI page, work out night time, keep MyFlightbook import CSVs, and see your stats, currency and route map.
url: https://github.com/eblatner-arch/oooi-logger-haos
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:airplane-clock
panel_title: Flight Log
ports:
  8199/tcp: null
ports_description:
  8199/tcp: Direct web app for the iPhone Home Screen. Off by default; enter 8199 to turn it on.
map:
  - type: share
    read_only: false
options:
  gemini_api_key: ""
  gemini_model: gemini-3.5-flash-lite
  google_client_id: ""
  google_client_secret: ""
  drive_folder: OOOI Logger (Home Assistant)
  app_password: ""
schema:
  gemini_api_key: password?
  gemini_model: str
  google_client_id: str?
  google_client_secret: password?
  drive_folder: str
  app_password: password?
