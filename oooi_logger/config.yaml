name: OOOI Flight Logger
version: "1.0.0"
slug: oooi_logger
description: Scan the ACARS OOOI page, work out night time, and keep MyFlightbook import CSVs in Google Drive.
url: https://github.com/eblatner-arch/oooi-logger-haos
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:airplane-clock
panel_title: Flight Log
map:
  - type: share
    read_only: false
options:
  gemini_api_key: ""
  gemini_model: gemini-3.8-flash
  google_client_id: ""
  google_client_secret: ""
  drive_folder: OOOI Logger (Home Assistant)
schema:
  gemini_api_key: password?
  gemini_model: str
  google_client_id: str?
  google_client_secret: password?
  drive_folder: str
